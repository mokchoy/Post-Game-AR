# cv.seed controls match-group fold shuffling. The 20% test reservation is fixed at seed 42.
cv:
  folds: 5
  seed: 42

# Used only for official yolo11n-pose person-box association during preparation.
preparation:
  confidence: 0.30

# Native Ultralytics predict() thresholds used for evaluation and overlays.
inference:
  confidence: 0.25
  keypoint_confidence: 0.25
  iou: 0.70

# Native Ultralytics model.train() argument names. Dataset, task, model, output path,
# pretrained initialization, and independent fold initialization are pipeline controlled.
train:
  epochs: 100
  patience: 20
  batch: 8
  imgsz: 640
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0
  close_mosaic: 0
  box: 7.5
  cls: 0.5
  dfl: 1.5
  pose: 12.0
  kobj: 1.0
  freeze: null
  device: 0
  workers: 0
  seed: 42
  amp: true
  cache: false
  plots: false
  verbose: false
