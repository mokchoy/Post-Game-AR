# Point-only YOLO11n experiment. CLI commands and held-out membership are pipeline controlled.
cv:
  folds: 5
  seed: 42

model:
  input_width: 960
  input_height: 540
  gaussian_sigma: 2.0

train:
  epochs: 100
  patience: 20
  batch: 8
  optimizer: AdamW
  lr0: 0.001
  weight_decay: 0.0005
  freeze_backbone_epochs: 0
  horizontal_flip_probability: 0.5
  seed: 42
  device: 0
  workers: 0
  amp: true
