<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Times New Roman, serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z"/></marker></defs>
<rect width="900" height="640" fill="#fff"/>
<g fill="none" stroke="#000" stroke-width="1.2">
<rect x="10" y="30" width="270" height="560" stroke-dasharray="6 3"/>
<rect x="310" y="30" width="270" height="270" stroke-dasharray="6 3"/>
<rect x="310" y="320" width="580" height="270" stroke-dasharray="6 3"/>
<rect x="600" y="30" width="290" height="270" stroke-dasharray="6 3"/>
</g>
<g font-style="italic" font-size="14"><text x="20" y="48">(a) Shuttlecock + person tracking (offline)</text><text x="320" y="48">(b) Gesture recognition (laptop camera)</text><text x="610" y="48">(c) Per-game data packaging</text><text x="320" y="338">(d) AR projection (live, projector-camera rig)</text></g>
<g fill="#fff" stroke="#000" stroke-width="1.2" text-anchor="middle">
<rect x="40" y="70" width="210" height="44"/><text x="145" y="89" stroke="none" fill="#000">Broadcast rally clip</text><text x="145" y="105" stroke="none" fill="#000">(cleaned_rallies)</text>
<rect x="40" y="150" width="210" height="60"/><text x="145" y="172" stroke="none" fill="#000">MonoTrack</text><text x="145" y="190" stroke="none" fill="#000">court · shuttle trajectory · players</text>
<rect x="40" y="250" width="210" height="44"/><text x="145" y="269" stroke="none" fill="#000">Annotation CSV (set1.csv)</text><text x="145" y="285" stroke="none" fill="#000">rally, scores, hits</text>
<rect x="40" y="330" width="210" height="60"/><text x="145" y="352" stroke="none" fill="#000">Projection + trajectory files</text><text x="145" y="370" stroke="none" fill="#000">top-down derived view</text>
<rect x="40" y="430" width="210" height="60"/><text x="145" y="452" stroke="none" fill="#000">Side-by-side render, cropped</text><text x="145" y="470" stroke="none" fill="#000">game + top-down .mp4 clips</text>

<rect x="340" y="70" width="210" height="36"/><text x="445" y="93" stroke="none" fill="#000">Laptop camera</text>
<rect x="340" y="124" width="210" height="36"/><text x="445" y="147" stroke="none" fill="#000">MediaPipe hands (skeleton)</text>
<rect x="340" y="178" width="210" height="36"/><text x="445" y="201" stroke="none" fill="#000">DD-Net classifier</text>
<rect x="340" y="232" width="210" height="50"/><text x="445" y="252" stroke="none" fill="#000">StableController (4/5 votes, ≥0.70)</text><text x="445" y="270" stroke="none" fill="#000">edge trigger + cooldown</text>

<rect x="630" y="70" width="230" height="50"/><text x="745" y="90" stroke="none" fill="#000">build_game_info.py</text><text x="745" y="108" stroke="none" fill="#000">score (CSV) · flags · web stats</text>
<rect x="630" y="170" width="230" height="50"/><text x="745" y="190" stroke="none" fill="#000">games.json</text><text x="745" y="208" stroke="none" fill="#000">videos, players, scores per game</text>

<rect x="330" y="365" width="150" height="50"/><text x="405" y="385" stroke="none" fill="#000">Projector camera</text><text x="405" y="403" stroke="none" fill="#000">+ undistort</text>
<rect x="330" y="440" width="150" height="60"/><text x="405" y="460" stroke="none" fill="#000">AprilTag + landmark</text><text x="405" y="478" stroke="none" fill="#000">localisation + smoothing</text><text x="405" y="494" stroke="none" fill="#000">→ camera pose</text>
<rect x="510" y="365" width="170" height="60"/><text x="595" y="385" stroke="none" fill="#000">ArrayState</text><text x="595" y="403" stroke="none" fill="#000">game · yaw · scale · play</text>
<rect x="510" y="450" width="170" height="60"/><text x="595" y="470" stroke="none" fill="#000">ArrayContent</text><text x="595" y="488" stroke="none" fill="#000">video loops, score/stats</text><text x="595" y="503" stroke="none" fill="#000">textures</text>
<rect x="710" y="365" width="160" height="60"/><text x="790" y="385" stroke="none" fill="#000">Panel geometry</text><text x="790" y="403" stroke="none" fill="#000">4 panels, near-plane</text><text x="790" y="418" stroke="none" fill="#000">clipping</text>
<rect x="710" y="450" width="160" height="60"/><text x="790" y="470" stroke="none" fill="#000">Ray/plane compositing</text><text x="790" y="488" stroke="none" fill="#000">+ depth occlusion</text>
<rect x="710" y="535" width="160" height="40"/><text x="790" y="560" stroke="none" fill="#000">Projected panels</text>
</g>
